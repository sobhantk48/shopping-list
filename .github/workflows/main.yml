name: Build and Package NDK

on:
  workflow_dispatch:

jobs:
  package-ndk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NDK via SDKManager
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f -executable | head -n 1)
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "ndk;27.2.12479018"

      - name: Zip NDK
        run: |
          cd "$ANDROID_SDK_ROOT"
          zip -r -q /tmp/ndk-27.2.12479018-linux.zip ndk/27.2.12479018

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndk-27.2.12479018-linux
          path: /tmp/ndk-27.2.12479018-linux.zip
          retention-days: 1

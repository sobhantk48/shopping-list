name: Build and Package NDK

on:
  workflow_dispatch:

jobs:
  package-ndk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NDK via SDKManager
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;27.2.12479018"

      - name: Zip NDK
        run: |
          cd $ANDROID_SDK_ROOT
          # ساخت زیپ با حفظ ساختار استاندارد ndk/27.2.12479018
          zip -r -q /tmp/ndk-27.2.12479018-linux.zip ndk/27.2.12479018

      - name: Upload NDK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: /tmp/ndk-27.2.12479018-linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: ndk-27.2.12479018-linux
          path: /tmp/ndk-27.2.12479018-linux.zip
          retention-days: 1

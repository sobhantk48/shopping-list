name: Download Gradle Offline Cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-gradle-cache:
    name: Build portable Gradle cache
    runs-on: ubuntu-latest

    env:
      GRADLE_VERSION: "9.7.1"
      AGP_VERSION: "9.1.1"
      KOTLIN_VERSION: "2.2.21"

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -eux
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "gradle-${GRADLE_VERSION}-bin.zip" -d "$HOME"
          echo "$HOME/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Create minimal valid Android Gradle project
        run: |
          set -eux

          mkdir -p cache-project/app
          cd cache-project

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "gradle-cache-downloader"
          include(":app")
          EOF

          cat > build.gradle.kts <<EOF
          plugins {
              id("com.android.application") version "${AGP_VERSION}" apply false
              id("org.jetbrains.kotlin.android") version "${KOTLIN_VERSION}" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.cache"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.example.cache"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.appcompat:appcompat:1.7.1")
              implementation("com.google.android.material:material:1.13.0")
          }
          EOF

          cat > build.gradle.kts.tmp <<'EOF'
          EOF

      - name: Resolve AGP, Kotlin plugin, and Android dependencies
        run: |
          set -eux
          cd cache-project

          # فقط configuration را انجام می‌دهد:
          # plugin markerها + AGP + وابستگی‌های انتقالی دانلود می‌شوند.
          gradle help \
            --no-daemon \
            --refresh-dependencies \
            --stacktrace

          # dependencyهای اپ را نیز واقعاً resolve می‌کند.
          gradle :app:dependencies \
            --configuration debugRuntimeClasspath \
            --no-daemon \
            --refresh-dependencies \
            --stacktrace

      - name: Verify AGP 9.1.1 is actually cached
        run: |
          set -eux

          find "$HOME/.gradle/caches/modules-2/files-2.1" \
            -path "*com.android.tools.build/gradle/9.1.1*" \
            -print

          test -d "$HOME/.gradle/caches/modules-2/files-2.1/com.android.tools.build/gradle/9.1.1"

      - name: Remove temporary locks
        run: |
          set -eux
          find "$HOME/.gradle/caches" -type f \( -name "*.lock" -o -name "gc.properties" \) -delete

      - name: Package Gradle caches
        run: |
          set -eux
          cd "$HOME"

          # modules-2 هم فایل‌ها و هم metadata لازم برای حالت --offline را دارد.
          # wrapper/dists هم اضافه می‌شود تا فایل‌های Gradle دانلودشده باقی بمانند.
          tar -I 'zstd -19 -T0' -cf gradle-cache-offline-agp-${AGP_VERSION}.tar.zst \
            .gradle/caches/modules-2 \
            .gradle/wrapper/dists 2>/dev/null || \
          tar -I 'zstd -19 -T0' -cf gradle-cache-offline-agp-${AGP_VERSION}.tar.zst \
            .gradle/caches/modules-2

          ls -lh gradle-cache-offline-agp-${AGP_VERSION}.tar.zst

      - name: Upload offline Gradle cache
        uses: actions/upload-artifact@v4
        with:
          name: gradle-cache-offline-agp-${{ env.AGP_VERSION }}
          path: ~/gradle-cache-offline-agp-${{ env.AGP_VERSION }}.tar.zst
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

name: Build Android SDK Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android Commandline Tools & Download Platform
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          
          # دانلود آخرین نسخه ابزارهای خط فرمان رسمی
          curl -s -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools.zip
          mv cmdline-tools latest
          rm commandlinetools.zip
          
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          
          # ایجاد مستقیم فایل‌های لایسنس تایید شده بدون نیاز به پایپ yes
          mkdir -p $ANDROID_HOME/licenses
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          printf "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license

          # نصب پلتفرم مورد نیاز
          sdkmanager --install "platforms;android-34"

      - name: Create Bundle ZIP
        run: |
          cd $HOME/android-sdk
          # فقط پلتفرم‌ها، لایسنس‌ها و ابزارهای کامندلاین رو زیپ می‌کنیم
          zip -r -q $GITHUB_WORKSPACE/android-sdk-arm-bundle.zip cmdline-tools platforms licenses

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-arm-bundle
          path: android-sdk-arm-bundle.zip
          retention-days: 5

name: Download Gradle Offline Cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-gradle-cache:
    name: Build portable Gradle cache
    runs-on: ubuntu-latest

    env:
      GRADLE_VERSION: "9.7.1"
      AGP_VERSION: "9.1.1"
      KOTLIN_VERSION: "2.2.21"

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 components
        run: |
          set -eux
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Gradle
        run: |
          set -eux
          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          unzip -q \
            "gradle-${GRADLE_VERSION}-bin.zip" \
            -d "$HOME"

          echo "$HOME/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Create a valid AGP 9 cache project
        run: |
          set -eux

          mkdir -p cache-project/app
          cd cache-project

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "gradle-cache-downloader"
          include(":app")
          EOF

          # KGP با apply false دانلود می‌شود، اما به app اعمال نخواهد شد.
          cat > build.gradle.kts <<EOF
          plugins {
              id("com.android.application") version "${AGP_VERSION}" apply false
              id("org.jetbrains.kotlin.android") version "${KOTLIN_VERSION}" apply false
          }
          EOF

          # نکته مهم:
          # در AGP 9 نباید org.jetbrains.kotlin.android را اینجا apply کرد.
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.example.gradlecache"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.example.gradlecache"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

      - name: Resolve plugins and Android dependencies
        run: |
          set -eux
          cd cache-project

          gradle help \
            --no-daemon \
            --refresh-dependencies \
            --stacktrace

          gradle :app:dependencies \
            --configuration debugRuntimeClasspath \
            --no-daemon \
            --refresh-dependencies \
            --stacktrace

      - name: Verify AGP 9.1.1 is in Gradle cache
        run: |
          set -eux

          AGP_DIR="$HOME/.gradle/caches/modules-2/files-2.1/com.android.tools.build/gradle/${AGP_VERSION}"

          test -d "$AGP_DIR"

          echo "AGP cache directory:"
          find "$AGP_DIR" -maxdepth 3 -type f -print

      - name: Remove Gradle locks
        run: |
          set -eux

          find "$HOME/.gradle/caches" \
            -type f \
            \( -name "*.lock" -o -name "gc.properties" \) \
            -delete

      - name: Package portable Gradle cache
        run: |
          set -eux
          cd "$HOME"

          # modules-2 شامل jar/pom/module و metadata لازم برای --offline است.
          tar -I 'zstd -19 -T0' \
            -cf "gradle-cache-offline-agp-${AGP_VERSION}.tar.zst" \
            .gradle/caches/modules-2

          ls -lh "gradle-cache-offline-agp-${AGP_VERSION}.tar.zst"

      - name: Upload Gradle cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: gradle-cache-offline-agp-${{ env.AGP_VERSION }}
          path: ~/gradle-cache-offline-agp-${{ env.AGP_VERSION }}.tar.zst
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

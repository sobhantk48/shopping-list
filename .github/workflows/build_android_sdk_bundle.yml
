name: Build Full Gradle Cache

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Dummy Android Project with Full AGP & Kotlin
        run: |
          mkdir -p fake-project/app
          cd fake-project

          # settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          Id = "com.example.v2raystk"
                  minSdk = 24
                  target()
                  mavenCentral()
              }
          }
          rootProject.name = "v2raystk_cache_builder"
          include(":app")
          EOF

          # root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.9.0" apply false
              id("org.jetbrains.kotlin.android") version "2.1.10" apply false
          }
          EOF

          # app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.v2raystk"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.example.v2raystk"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

      - name: Download All Gradle Dependencies & Build
        run: |
          cd fake-project
          # استفاده از گریدل برای دانلود و بیلد کامل
          gradle assembleDebug --no-daemon --stacktrace

      - name: Clean & Package Gradle Cache
        run: |
          cd ~/.gradle/caches
          # حذف فایل‌های قفل و متادیتای پویا برای جلوگیری از خطای دسترسی آفلاین
          find . -name "*.lock" -type f -delete
          find . -name "gc.properties" -type f -delete
          
          cd ~
          zip -r9 /tmp/gradle-cache-offline.zip .gradle/caches/modules-2

      - name: Create Release and Upload Cache
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gradle-cache-v1
          name: "Offline Gradle Cache"
          body: "Complete Gradle modules-2 cache for AGP and Android 36"
          files: /tmp/gradle-cache-offline.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
